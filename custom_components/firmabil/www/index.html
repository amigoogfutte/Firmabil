<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Firmabil">
<meta name="theme-color" content="#1F4E85">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Firmabil</title>
<style>
:root{
  --bg:#F3F5F8; --card:#FFFFFF; --ink:#1A1E24; --muted:#59616C; --line:#C8CED6; --soft:#E2E6EC;
  --accent:#1F4E85; --accent-soft:#E8F0FA; --ok:#1F6F5C; --ok-soft:#E3F1EC; --warn-bg:#FFF3E6; --warn-ink:#6B3A10; --danger:#A3311F; --danger-soft:#FBE9E6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
html,body,button,a,input,select,textarea,summary,label{touch-action:manipulation}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:10px 0 6px}
h1{margin:0;font-size:26px;font-weight:700}
h2{margin:0;font-size:17px;font-weight:650}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-top:12px;display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;color:var(--muted);min-width:0}
input[type=text],input[type=search],input[type=number],input[type=tel],select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff;font-size:16px}
.row{display:flex;gap:8px;align-items:center}
.row > *{flex:1;min-width:0}
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:15px;padding:0 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.big{min-height:64px;font-size:18px;border-radius:16px}
.btn.small{min-height:40px;font-size:14px;padding:0 12px;flex:0 0 auto}
.btn.danger{color:var(--danger);border-color:#E3B9B1}
.btn:disabled{opacity:.45}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--soft);padding:4px;border-radius:12px}
.seg button{min-height:46px;border:none;border-radius:9px;background:transparent;font-weight:650;cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg.mode button[data-v=ud][aria-pressed=true]{background:var(--danger-soft);color:var(--danger)}
.seg.mode button[data-v=ind][aria-pressed=true]{background:var(--ok-soft);color:var(--ok)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper input{width:130px;text-align:center;font-size:36px;font-weight:700;border:none!important;min-height:auto!important;padding:0!important;background:transparent!important}
.stepper .btn{width:64px;height:64px;font-size:28px;flex:0 0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.sortRow{display:flex;gap:6px;align-items:center}
.sortRow select{flex:1;min-height:40px;padding:6px 10px;font-size:14px}
.sortRow .btn{min-height:40px;width:44px;padding:0;flex:0 0 auto}
.sortRow .btn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.list{display:flex;flex-direction:column}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--soft);cursor:pointer;background:none;border-left:none;border-right:none;border-bottom:none;text-align:left;width:100%}
.item:first-child{border-top:none}
.item .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.item .navn{font-weight:600;overflow-wrap:anywhere}
.item .tal{font-weight:700;white-space:nowrap;text-align:right}
.lav{color:var(--danger)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--danger-soft);color:var(--danger)}
.empty{color:var(--muted);padding:8px 0}
#syncBar{font-size:13px;padding:8px 12px;border-radius:10px;margin-top:6px;cursor:pointer}
#syncBar.ok{background:var(--ok-soft);color:var(--ok)}
#syncBar.busy{background:var(--soft);color:var(--muted)}
#syncBar.login,#syncBar.error{background:var(--warn-bg);color:var(--warn-ink)}
#syncBar.offline{background:var(--soft);color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--soft);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs button{border:none;background:none;min-height:52px;border-radius:12px;font-weight:650;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative}
nav.tabs button[aria-pressed=true]{color:var(--accent);background:var(--accent-soft)}
nav.tabs .ik{font-size:20px;line-height:1}
nav.tabs .badge{position:absolute;top:4px;right:calc(50% - 30px);background:var(--danger);color:#fff;font-size:11px;font-weight:700;border-radius:9px;padding:1px 6px}
/* scanner */
#scanBox{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3}
#scanBox video{width:100%;height:100%;object-fit:cover;display:block}
#scanBox .sigte{position:absolute;left:10%;right:10%;top:50%;height:2px;background:#ff3b30;box-shadow:0 0 8px #ff3b30}
#scanBox .ramme{position:absolute;left:8%;right:8%;top:28%;bottom:28%;border:3px solid rgba(255,255,255,.85);border-radius:12px}
#scanBox .luk{position:absolute;right:10px;top:10px;min-height:40px;background:rgba(0,0,0,.55);color:#fff;border:none}
#scanBox .hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 3px #000}
/* ark (dialog) */
#arkBg{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
#ark{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
#ark .arkTop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#ark h2{font-size:20px}
.beholdning{font-size:15px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.beholdning.lav{background:var(--danger-soft);color:var(--danger)}
.check{display:flex;gap:10px;align-items:center;font-size:15px;min-height:44px}
.check input{width:24px;height:24px}
.kode{font-family:ui-monospace,Menlo,monospace;font-size:14px}
/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top));min-width:260px;justify-content:space-between;background:#1A1E24;color:#fff;padding:12px 16px;border-radius:12px;font-size:15px;z-index:60;display:flex;gap:14px;align-items:center;max-width:92vw;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#toast button{background:none;border:none;color:#9CC3F5;font-weight:700;font-size:15px;cursor:pointer;padding:4px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1>Firmabil</h1><div class="muted" id="undertitel">Lager i bilen</div></div>
  </header>
  <div id="syncBar" class="hidden"></div>

  <!-- SCAN -->
  <section id="tab-scan">
    <div class="card">
      <div class="seg mode" id="modeSeg">
        <button type="button" data-v="ud" aria-pressed="true">Tag ud</button>
        <button type="button" data-v="ind" aria-pressed="false">Fyld op</button>
      </div>
      <div id="sagBox" style="display:flex;flex-direction:column;gap:8px">
        <div class="chips" id="bfChips" role="group" aria-label="Vis kun boligforening"></div>
        <div class="sortRow" id="sortRow"></div>
        <label class="f">Sag (materialet skrives på timesedlen)
          <select id="sagValg"></select>
        </label>
        <div class="muted" id="timerInfo" style="margin-top:6px"></div>
      </div>
      <div id="scanBox" class="hidden">
        <video id="video" playsinline muted autoplay></video>
        <div class="ramme"></div><div class="sigte"></div>
        <button type="button" class="btn small luk" id="scanStop">Luk</button>
        <div class="hint">Hold stregkoden inden for rammen</div>
      </div>
      <button type="button" class="btn primary big" id="scanStart">📷 Scan stregkode</button>
      <div class="row">
        <input type="search" id="soeg" placeholder="Eller søg vare / skriv kode" autocomplete="off" enterkeyhint="search">
      </div>
      <div class="list" id="soegListe"></div>
    </div>
    <div class="card">
      <h2>I dag</h2>
      <div class="list" id="idagListe"></div>
    </div>
  </section>

  <!-- LAGER -->
  <section id="tab-lager" class="hidden">
    <div class="card">
      <input type="search" id="lagerSoeg" placeholder="Søg i lageret" autocomplete="off">
      <div class="list" id="lagerListe"></div>
      <button type="button" class="btn" id="nyVareBtn">+ Ny vare (uden stregkode)</button>
    </div>
    <p class="muted" style="text-align:center;margin-top:18px" id="versionTxt"></p>
  </section>

  <!-- KØB -->
  <section id="tab-koeb" class="hidden">
    <div class="card">
      <h2>Skal købes</h2>
      <p class="muted" style="margin:0">Varer der er under minimum i bilen.</p>
      <div class="list" id="koebListe"></div>
      <div class="row" id="koebKnapper">
        <button type="button" class="btn" id="koebKopier">Kopiér liste</button>
        <button type="button" class="btn primary" id="koebDel">Del liste</button>
      </div>
    </div>
  </section>
</div>

<nav class="tabs" id="tabs">
  <button type="button" data-tab="scan" aria-pressed="true"><span class="ik">📷</span>Scan</button>
  <button type="button" data-tab="lager" aria-pressed="false"><span class="ik">📦</span>Lager</button>
  <button type="button" data-tab="koeb" aria-pressed="false"><span class="ik">🛒</span>Skal købes<span class="badge hidden" id="koebBadge"></span></button>
</nav>

<div id="arkBg" class="hidden"><div id="ark" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="hidden"></div>

<script>
(function(){
  "use strict";
  const VERSION = "0.2.0";
  const $ = id => document.getElementById(id);
  function el(tag, attrs, ...kids){
    const e=document.createElement(tag);
    if(attrs) for(const k in attrs){ const v=attrs[k]; if(v==null||v===false) continue;
      if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
      else if(k==="class") e.className=v; else if(k==="style") e.setAttribute("style",v);
      else if(k==="value") e.value=v; else if(k==="checked") e.checked=!!v; else e.setAttribute(k,v===true?"":v); }
    for(const c of kids.flat()){ if(c==null||c===false) continue; e.appendChild(typeof c==="object"?c:document.createTextNode(String(c))); }
    return e;
  }
  function newId(p){ return p+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8); }
  function idag(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  const fmt = n => (Math.round(n*100)/100).toLocaleString("da-DK");
  const ls = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };

  // --- toast ---
  let toastT=null;
  function toast(msg, fortryd){
    const t=$("toast"); t.replaceChildren(el("span",null,msg));
    if(fortryd) t.appendChild(el("button",{type:"button",onclick:()=>{ t.classList.add("hidden"); fortryd(); }},"Fortryd"));
    t.classList.remove("hidden"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.add("hidden"), fortryd?6000:2600);
  }

  // ================= DATA =================
  // Poster: vare {kind:"vare", navn, koder[], stkPrKasse, min, varenr, enhed, timerEnhed:"stk"|"kasse"}
  //         bev  {kind:"bev", vareId, delta (stk, + ind / − ud), art:"ind"|"ud"|"tael", kasser, sagId, sagTekst, timerPost, dato, oprettet}
  const DATAKEY="fb_data_v1";
  let db = ls.get(DATAKEY,null); if(!db||!db.records) db={records:{},dirty:[]};
  function persist(){ try{ localStorage.setItem(DATAKEY, JSON.stringify(db)); }catch(e){ toast("Telefonen kunne ikke gemme"); } }
  const levende = kind => Object.values(db.records).filter(r=>r && !r.deleted && r.kind===kind);
  function put(id,data){ const prev=db.records[id]; const now=Math.max(Date.now(), prev?(prev.updated||0)+1:0); db.records[id]=Object.assign({},data,{id,updated:now}); if(!db.dirty.includes(id)) db.dirty.push(id); persist(); renderAll(); scheduleSync(1200); return db.records[id]; }
  function del(id){ const prev=db.records[id]; const now=Math.max(Date.now(), prev?(prev.updated||0)+1:0); db.records[id]={id,updated:now,deleted:true,kind:prev?prev.kind:""}; if(!db.dirty.includes(id)) db.dirty.push(id); persist(); renderAll(); scheduleSync(1200); }

  const varer = () => levende("vare").sort((a,b)=>a.navn.localeCompare(b.navn,"da"));
  function beholdning(vareId){ let s=0; for(const b of levende("bev")) if(b.vareId===vareId) s+=Number(b.delta)||0; return s; }
  function fordeling(v, s){
    const k=Number(v.stkPrKasse)||0;
    if(k<=0 || s<=0) return "";
    const ks=Math.floor(s/k), rest=s-ks*k;
    if(!ks) return "under 1 kasse";
    return ks+(ks===1?" kasse":" kasser")+(rest?" + "+fmt(rest)+" stk":"");
  }
  const erLav = (v,s) => (Number(v.min)||0) > 0 && s < Number(v.min);
  function findKode(kode){ kode=String(kode).trim(); return varer().find(v=>(v.koder||[]).includes(kode)); }
  const enh = v => v.enhed || "stk";

  // ================= LOGIN (samme Home Assistant-login som Timer) =================
  const HA = location.pathname.startsWith("/firmabil-app/");
  let inFrame=false; try{ inFrame = window.self !== window.top; }catch(e){ inFrame=true; }
  const APP_BASE = location.origin + "/firmabil-app/";
  const CLIENT_ID = APP_BASE, REDIRECT_URI = APP_BASE + "index.html";
  const authGet=()=>ls.get("fb_auth",null);
  const authSet=a=>{ try{ a?localStorage.setItem("fb_auth",JSON.stringify(a)):localStorage.removeItem("fb_auth"); }catch(e){} };
  function fetchT(url, opts, ms){ const ac=new AbortController(); const t=setTimeout(()=>ac.abort(), ms||20000); return fetch(url, Object.assign({}, opts||{}, {signal:ac.signal})).finally(()=>clearTimeout(t)); }
  async function tokenRequest(params){
    const r=await fetchT("/auth/token",{method:"POST",body:new URLSearchParams(params)});
    if(!r.ok){ const e=new Error("auth "+r.status); e.status=r.status; throw e; }
    const j=await r.json();
    return {access_token:j.access_token, refresh_token:j.refresh_token||params.refresh_token, expires:Date.now()+(j.expires_in||1800)*1000, clientId:params.client_id};
  }
  async function parentToken(){
    try{ if(!inFrame) return null; const ha=window.parent.document.querySelector("home-assistant"); const a=ha&&ha.hass&&ha.hass.auth; if(!a) return null; if(a.expired) await Promise.race([a.refreshAccessToken(), new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),15000))]); return a.accessToken||null; }catch(e){ return null; }
  }
  async function getToken(force){
    const pt=await parentToken(); if(pt) return pt;
    let a=authGet();
    if(!a){ const h=ls.get("hassTokens",null); if(h&&h.refresh_token&&h.clientId) a={access_token:h.access_token,refresh_token:h.refresh_token,expires:h.expires||0,clientId:h.clientId,borrowed:true}; }
    if(!a) return null;
    if(!force && a.access_token && a.expires>Date.now()+30000) return a.access_token;
    try{ const n=await tokenRequest({grant_type:"refresh_token",refresh_token:a.refresh_token,client_id:a.clientId}); if(!a.borrowed) authSet(n); return n.access_token; }
    catch(e){ if(e.status===400||e.status===403){ if(!a.borrowed) authSet(null); return null; } throw e; }
  }
  function startLogin(){
    const st=newId("s"); try{ localStorage.setItem("fb_state",st); }catch(e){}
    location.href="/auth/authorize?response_type=code&client_id="+encodeURIComponent(CLIENT_ID)+"&redirect_uri="+encodeURIComponent(REDIRECT_URI)+"&state="+encodeURIComponent(st);
  }
  async function handleLoginReturn(){
    if(!HA) return;
    const q=new URLSearchParams(location.search); const code=q.get("code"); if(!code) return;
    history.replaceState(null,"",location.pathname+location.hash);
    let expected=null; try{ expected=localStorage.getItem("fb_state"); localStorage.removeItem("fb_state"); }catch(e){}
    if(expected && q.get("state")!==expected){ toast("Login mislykkedes – prøv igen"); return; }
    try{ authSet(await tokenRequest({grant_type:"authorization_code",code,client_id:CLIENT_ID})); toast("Logget ind"); }catch(e){ toast("Login mislykkedes – prøv igen"); }
  }
  async function api(path,opts={},retried){
    const t=await getToken(retried);
    if(!t){ const e=new Error("login"); e.login=true; throw e; }
    const r=await fetchT(path,Object.assign({},opts,{headers:Object.assign({},opts.headers||{},{Authorization:"Bearer "+t})}));
    if(r.status===401 && !retried) return api(path,opts,true);
    if(r.status===401){ authSet(null); const e=new Error("login"); e.login=true; throw e; }
    if(r.status===404){ const e=new Error("mangler"); e.missing=true; throw e; }
    return r;
  }

  // ================= TIMER-APPEN (sager + materialer på timesedlen) =================
  // Timer-appens egne data røres kun gennem dens synkronisering: vi henter sager og sender nye materiale-poster.
  let timer = ls.get("fb_timer",{sager:[],faste:[],hentet:0,status:"ukendt"});
  let timerUd = ls.get("fb_timer_ud",[]);
  const SORT_STD={brugt:false,nr:true,adresse:true,bf:true,oprettet:false};  // naturlig retning pr. felt (true = stigende)   // poster der venter på at blive sendt til Timer
  function gemTimer(){ ls.set("fb_timer",timer); ls.set("fb_timer_ud",timerUd); }
  function sagNavn(s){ return s ? ((s.bf? s.bf+" · ":"")+"Sag "+s.nr+" · "+(s.adresse||"")) : "Ukendt sag"; }
  async function hentFraTimer(){
    if(!HA) return;
    try{
      const sendt=timerUd.slice();
      const r=await api("/api/timeregistrering/sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({poster:sendt})});
      if(!r.ok) throw new Error("timer "+r.status);
      const j=await r.json(); const alle=j.poster||[];
      const brugt={};
      for(const p of alle) if(p.kind==="post" && !p.deleted) brugt[p.sagId]=Math.max(brugt[p.sagId]||0,p.oprettet||0);
      timer.sager=alle.filter(p=>p.kind==="sag" && !p.deleted && !p.arkiveret)
        .map(s=>({id:s.id,nr:s.nr,adresse:s.adresse,bf:s.bf||"",oprettet:s.oprettet||0,brugt:brugt[s.id]||0}));
      const si=alle.find(p=>p.id==="indst-sort" && !p.deleted);
      if(si && SORT_STD.hasOwnProperty(si.felt) && !timerUd.some(p=>p.id==="indst-sort")) timer.sort={felt:si.felt, op:!!si.op, updated:si.updated||0};
      timer.faste=alle.filter(p=>p.kind==="fast" && !p.deleted).map(f=>({navn:f.navn,enhed:f.enhed||"stk",varenr:f.varenr||""}));
      timer.hentet=Date.now(); timer.status="ok";
      const ids=new Set(sendt.map(p=>p.id+":"+p.updated)); timerUd=timerUd.filter(p=>!ids.has(p.id+":"+p.updated));
    }catch(e){
      timer.status = e.missing? "mangler" : e.login? "login" : "fejl";
    }
    gemTimer(); renderSager();
  }
  function sendTilTimer(post){ timerUd.push(post); gemTimer(); scheduleSync(300); }

  // ================= SYNKRONISERING =================
  let syncState={status:HA?"idle":"off", last:ls.get("fb_lastSync",0), msg:""};
  let syncing=false, syncAgain=false, syncTimer=null, syncStart=0, syncTur=0;
  function syncText(){
    const t=syncState.last? new Date(syncState.last).toLocaleTimeString("da-DK",{hour:"2-digit",minute:"2-digit"}) : "";
    const n=db.dirty.length+timerUd.length;
    switch(syncState.status){
      case "busy": return ["busy","Synkroniserer …"];
      case "ok": return n? ["busy", n+" ændring(er) venter på at blive sendt"] : ["ok","Synkroniseret med server "+t];
      case "login": return ["login","Ikke logget ind – tryk her for at logge ind på serveren"];
      case "offline": return ["offline","Ingen forbindelse – gemmes på telefonen"+(n?" ("+n+" venter)":"")+" og sendes senere"];
      case "error": return ["error",(syncState.msg||"Kunne ikke synkronisere")+" – tryk for at prøve igen"];
      default: return ["busy","Forbinder …"];
    }
  }

  async function sync(){
    if(!HA) return;
    if(syncing && Date.now()-syncStart<30000){ syncAgain=true; return; }
    if(!navigator.onLine){ setSync("offline"); return; }
    syncing=true; syncStart=Date.now(); const minTur=++syncTur; setSync("busy");
    try{
      const sent={}; const poster=[];
      for(const id of db.dirty){ const r=db.records[id]; if(r){ sent[id]=r.updated; poster.push(r); } }
      const res=await api("/api/firmabil/sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({poster})});
      if(!res.ok) throw new Error("sync "+res.status);
      const j=await res.json(); let changed=false;
      for(const r of (j.poster||[])){ if(!r||!r.id) continue; const cur=db.records[r.id]; if(!cur || (r.updated||0)>(cur.updated||0)){ db.records[r.id]=r; changed=true; } }
      db.dirty=db.dirty.filter(id=>!(id in sent) || (db.records[id] && db.records[id].updated!==sent[id]));
      persist(); if(changed) renderAll();
      await hentFraTimer();
      syncState.last=Date.now(); ls.set("fb_lastSync",syncState.last);
      if(minTur===syncTur) setSync("ok");
    }catch(e){
      if(minTur!==syncTur) return;
      if(e.name==="AbortError") setSync("error","Serveren svarede ikke i tide");
      else if(e.login) setSync("login");
      else if(e.missing) setSync("error","Serveren svarer ikke");
      else setSync(navigator.onLine?"error":"offline", navigator.onLine?"Kunne ikke synkronisere":"");

    }
  }

  // ---- Samme sortering og boligforenings-filter som Timer-appen ----
  // Sorteringen er Timers egen indstilling (følger brugeren); filteret deles med Timer på samme enhed.
  function sortIndst(){ const t=timer.sort; return (t && SORT_STD.hasOwnProperty(t.felt)) ? t : {felt:"brugt", op:false}; }
  function sorterSager(liste){
    const {felt, op}=sortIndst();
    const sml=(a,b)=>String(a||"").localeCompare(String(b||""),"da",{numeric:true,sensitivity:"base"});
    const key={
      brugt:(a,b)=>(a.brugt||a.oprettet||0)-(b.brugt||b.oprettet||0),
      nr:(a,b)=>sml(a.nr,b.nr),
      adresse:(a,b)=>sml(a.adresse,b.adresse)||sml(a.nr,b.nr),
      bf:(a,b)=>sml(a.bf,b.bf)||sml(a.adresse,b.adresse),
      oprettet:(a,b)=>(a.oprettet||0)-(b.oprettet||0)
    }[felt];
    const r=op?1:-1;
    return liste.slice().sort((a,b)=>{ if(felt==="bf" && !a.bf!==!b.bf) return a.bf? -1 : 1; return key(a,b)*r; });
  }
  function gemSort(felt, op){

  let scanning=false, zxReader=null, nativeStop=null, sidste={kode:"",t:0};
  function hentZxing(){
    if(window.ZXing) return Promise.resolve();
    return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="zxing.min.js"; s.onload=res; s.onerror=()=>rej(new Error("zxing")); document.head.appendChild(s); });

  async function startScan(naarKode){
    if(scanning) stopScan();
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast("Kameraet kan ikke bruges her – skriv koden i stedet"); return; }
    scanning=true; $("scanBox").classList.remove("hidden"); $("scanStart").classList.add("hidden");
    const video=$("video");
    const fundet = kode => {
      const nu=Date.now(); if(kode===sidste.kode && nu-sidste.t<2500) return; sidste={kode,t:nu};
      try{ navigator.vibrate && navigator.vibrate(80); }catch(e){}
      bip(); stopScan(); naarKode(kode);
    };
    try{
      if("BarcodeDetector" in window){
        const fmts=["ean_13","ean_8","upc_a","upc_e","code_128","code_39","itf","qr_code"];
        const supp=await BarcodeDetector.getSupportedFormats().catch(()=>fmts);
        const det=new BarcodeDetector({formats:fmts.filter(f=>supp.includes(f))});
        const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1280},height:{ideal:720}},audio:false});
        video.srcObject=stream; await video.play();
        let stop=false; nativeStop=()=>{ stop=true; stream.getTracks().forEach(t=>t.stop()); video.srcObject=null; };
        const loop=async()=>{ if(stop) return; try{ const r=await det.detect(video); if(r && r[0] && r[0].rawValue){ fundet(r[0].rawValue); return; } }catch(e){} setTimeout(loop,150); };
        loop();
      }else{
        await hentZxing();
        const Z=window.ZXing; const hints=new Map();
        hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.ITF,Z.BarcodeFormat.QR_CODE]);
        hints.set(Z.DecodeHintType.TRY_HARDER,true);
        zxReader=new Z.BrowserMultiFormatReader(hints,150);
        await zxReader.decodeFromConstraints({video:{facingMode:"environment",width:{ideal:1280},height:{ideal:720}},audio:false}, video, (res)=>{ if(res && scanning) fundet(res.getText()); });
      }
    }catch(e){
      stopScan();
      toast(e && e.name==="NotAllowedError" ? "Giv appen lov til at bruge kameraet (Indstillinger → Safari → Kamera)" : "Kameraet kunne ikke startes");
    }
  }

      el("p",{class:"muted",style:"margin:0"},"Kommer beholdningen under minimum, havner varen på “Skal købes”."),
      el("button",{type:"button",class:"btn primary big",onclick:gem},"Opret vare"),
      (kode && varer().length)? el("details",null, el("summary",{class:"muted",style:"min-height:40px;display:flex;align-items:center"},"Eller: varen findes allerede (anden størrelse pakke, ny leverandør)"),
        el("div",{style:"display:flex;flex-direction:column;gap:8px;margin-top:8px"}, eksist, el("button",{type:"button",class:"btn",onclick:tilknyt},"Sæt koden på den valgte vare"))) : null
    );
    setTimeout(()=>navn.focus(),250);
  }
  $("nyVareBtn").addEventListener("click",()=>aabnNyVare(""));

  // --- ret vare / tæl op / historik ---
  function aabnVare(v){
    v=db.records[v.id]||v;
    const s=beholdning(v.id);
    const navn=el("input",{type:"text",value:v.navn});
    const prKasse=el("input",{type:"number",inputmode:"numeric",value:String(v.stkPrKasse||""),min:"0"});
    const min=el("input",{type:"number",inputmode:"numeric",value:String(v.min||0),min:"0"});
    const varenr=el("input",{type:"text",value:v.varenr||""});
    const tEnh=el("select",null, el("option",{value:"stk"},"Antal "+enh(v)), el("option",{value:"kasse"},"Antal kasser"));
    tEnh.value=v.timerEnhed||"stk";
    const taelInp=el("input",{type:"number",inputmode:"decimal",value:String(s),min:"0",step:"any"});
    let koder=[...(v.koder||[])];
    const kodeListe=el("div",{class:"list"});
    const tegnKoder=()=>kodeListe.replaceChildren(...(koder.length? koder.map(k=>el("div",{class:"item",style:"cursor:default"}, el("span",{class:"kode"},k), el("button",{type:"button",class:"btn small danger",onclick:()=>{ koder=koder.filter(x=>x!==k); tegnKoder(); }},"Fjern"))) : [el("div",{class:"empty"},"Ingen stregkoder – findes via søgning.")]));
    tegnKoder();
    const nyKode=el("input",{type:"tel",placeholder:"Skriv kode",inputmode:"numeric"});
    const tilfoejKode=k=>{ k=String(k||"").trim(); if(!k) return; const anden=findKode(k); if(anden && anden.id!==v.id){ toast("Koden bruges allerede på "+anden.navn); return; } if(!koder.includes(k)) koder.push(k); nyKode.value=""; tegnKoder(); };
    const gem=()=>{
      const n=navn.value.trim(); if(!n){ toast("Navnet mangler"); return; }
      put(v.id, Object.assign({}, db.records[v.id], {navn:n, stkPrKasse:Math.max(0,parseInt(prKasse.value)||0), min:Math.max(0,parseFloat(min.value)||0), varenr:varenr.value.trim(), timerEnhed:tEnh.value, koder}));
      const ny=parseFloat(String(taelInp.value).replace(",",".")); const nu=beholdning(v.id);
      if(!isNaN(ny) && ny>=0 && Math.abs(ny-nu)>1e-9) put(newId("bev"),{kind:"bev", vareId:v.id, delta:ny-nu, art:"tael", kasser:0, sagId:"", sagTekst:"", timerPost:"", dato:idag(), oprettet:Date.now()});
      lukArk(); toast("Gemt");
    };
    const slet=()=>{ if(!confirm("Slet "+v.navn+" fra lageret?")) return; for(const b of levende("bev")) if(b.vareId===v.id) del(b.id); del(v.id); lukArk(); toast("Vare slettet"); };
    const hist=levende("bev").filter(b=>b.vareId===v.id).sort((a,b)=>(b.oprettet||0)-(a.oprettet||0)).slice(0,25);
    const artTxt={ind:"Fyldt op",ud:"Taget ud",tael:"Optalt"};
    aabnArk(
      arkTop("Ret vare", v.navn),
      el("div",{class:"beholdning"+(erLav(v,s)?" lav":"")}, "I bilen nu: "+fmt(s)+" "+enh(v)+(fordeling(v,s)?" ("+fordeling(v,s)+")":"")),
      el("label",{class:"f"},"Tæl op – der er faktisk ("+enh(v)+")", taelInp),
      el("label",{class:"f"},"Navn", navn),
      el("div",{class:"row"}, el("label",{class:"f"},"Stk. pr. kasse", prKasse), el("label",{class:"f"},"Minimum", min)),
      el("div",{class:"row"}, el("label",{class:"f"},"Varenr.", varenr), el("label",{class:"f"},"På timesedlen", tEnh)),
      el("h2",null,"Stregkoder"), kodeListe,
      el("div",{class:"row"}, nyKode, el("button",{type:"button",class:"btn small",onclick:()=>tilfoejKode(nyKode.value)},"Tilføj"),
        el("button",{type:"button",class:"btn small",onclick:()=>{ lukArk(); visFane("scan"); startScan(k=>{
          const vv=db.records[v.id]; const anden=findKode(k);
          if(anden && anden.id!==v.id){ aabnVare(vv); toast("Koden bruges allerede på "+anden.navn); return; }
          put(v.id,Object.assign({},vv,{koder:[...new Set([...(vv.koder||[]),k])]})); aabnVare(db.records[v.id]); toast("Stregkode tilføjet");
        }); }},"📷")),
      el("button",{type:"button",class:"btn primary big",onclick:gem},"Gem"),
      el("h2",null,"Seneste bevægelser"),
      el("div",{class:"list"}, ...(hist.length? hist.map(b=>el("div",{class:"item",style:"cursor:default"},
        el("span",{class:"txt"}, el("span",null,artTxt[b.art]||b.art), el("span",{class:"muted"}, b.dato+(b.sagTekst?" · "+b.sagTekst:""))),
        el("span",{class:"tal"+(b.delta<0?" lav":"")}, (b.delta>0?"+":"")+fmt(b.delta)))) : [el("div",{class:"empty"},"Ingen endnu.")])),
      el("button",{type:"button",class:"btn danger",onclick:slet},"Slet vare")
    );
  }

  // ================= LISTER =================
  $("lagerSoeg").addEventListener("input",renderLager);
  function renderLager(){
    const q=$("lagerSoeg").value.trim().toLowerCase();
    const l=varer().filter(v=>!q || v.navn.toLowerCase().includes(q) || (v.varenr||"").toLowerCase().includes(q));
    $("lagerListe").replaceChildren(...(l.length? l.map(v=>vareRaekke(v,()=>aabnVare(v))) : [el("div",{class:"empty"}, varer().length? "Ingen varer matcher." : "Lageret er tomt. Scan en vare for at komme i gang.")]));
  }
  function koebListe(){ return varer().map(v=>({v,s:beholdning(v.id)})).filter(x=>erLav(x.v,x.s)); }
  function koebForslag(v,s){ const k=Number(v.stkPrKasse)||0; const mangler=Math.max(0,(Number(v.min)||0)-s); if(k>0){ const n=Math.max(1,Math.ceil(mangler/k)); return n+(n===1?" kasse":" kasser"); } return fmt(Math.max(mangler,1))+" "+enh(v); }
  function koebTekst(){ return "Skal købes til firmabilen:\n"+koebListe().map(({v,s})=>"- "+v.navn+(v.varenr?" ("+v.varenr+")":"")+": "+koebForslag(v,s)+"  ["+fmt(s)+" tilbage]").join("\n"); }
  function renderKoeb(){
    const l=koebListe();
    $("koebListe").replaceChildren(...(l.length? l.map(({v,s})=>el("button",{type:"button",class:"item",onclick:()=>aabnBevaegelse(v,"ind")},
      el("span",{class:"txt"}, el("span",{class:"navn"},v.navn), el("span",{class:"muted"}, fmt(s)+" "+enh(v)+" tilbage · min. "+fmt(v.min))),
      el("span",{class:"tal"},"Køb "+koebForslag(v,s)))) : [el("div",{class:"empty"},"Alt er på lager 👍")]));
    $("koebKnapper").classList.toggle("hidden", !l.length);
    const b=$("koebBadge"); b.textContent=String(l.length); b.classList.toggle("hidden", !l.length);
  }
  $("koebKopier").addEventListener("click",async()=>{ try{ await navigator.clipboard.writeText(koebTekst()); toast("Listen er kopieret"); }catch(e){ toast("Kunne ikke kopiere"); } });
  $("koebDel").addEventListener("click",async()=>{ const t=koebTekst(); if(navigator.share){ try{ await navigator.share({text:t}); }catch(e){} } else { try{ await navigator.clipboard.writeText(t); toast("Listen er kopieret"); }catch(e){} } });

  function renderIdag(){
    const d=idag(); const vm={}; for(const v of levende("vare")) vm[v.id]=v;
    const l=levende("bev").filter(b=>b.dato===d && b.art!=="tael").sort((a,b)=>(b.oprettet||0)-(a.oprettet||0));
    $("idagListe").replaceChildren(...(l.length? l.map(b=>{ const v=vm[b.vareId]; if(!v) return null;
      return el("div",{class:"item",style:"cursor:default"},
        el("span",{class:"txt"}, el("span",{class:"navn"},v.navn), el("span",{class:"muted"}, (b.art==="ud"?"Taget ud":"Fyldt op")+(b.sagTekst?" · "+b.sagTekst:"")+(b.timerPost?" · på timesedlen":""))),
        el("span",{class:"row",style:"flex:0 0 auto;gap:10px"}, el("span",{class:"tal"+(b.delta<0?" lav":"")}, (b.delta>0?"+":"")+fmt(b.delta)+" "+enh(v)),
          el("button",{type:"button",class:"btn small",onclick:()=>{ if(confirm("Fortryd denne?")) fortrydBev(b.id); }},"↶")));
    }) : [el("div",{class:"empty"},"Intet taget ud eller fyldt op i dag.")]));
  }

  function renderAll(){ renderLager(); renderKoeb(); renderIdag(); renderSoeg(); drawSync(); }

  // ================= START =================
  $("versionTxt").textContent="Firmabil v"+VERSION;
  renderMode(); renderSager(); renderAll();
  if("serviceWorker" in navigator && HA) navigator.serviceWorker.register("sw.js").catch(()=>{});
  (async()=>{
    await handleLoginReturn();
    if(!HA) return;
    sync();
    window.addEventListener("online",()=>scheduleSync(500));
    window.addEventListener("offline",()=>setSync("offline"));
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden) scheduleSync(300); });
    setInterval(()=>{ if(!document.hidden) sync(); },60000);
  })();
})();
</script>
</body>
</html>
